<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Firzan scribble mark</title>
  <desc id="description">An abstract looped logo drawn as a continuous, imperfect pen stroke.</desc>

  <defs>
    <filter id="rough-ink" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        seed="11"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="1.35"
        xChannelSelector="R"
        yChannelSelector="G"
      />
