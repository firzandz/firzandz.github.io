         C8 59 31 79 64 64
         C97 49 119 70 108 91
         C97 111 78 97 64 64
         C50 31 29 17 18 38
         C7 59 30 79 64 64
         C98 49 120 68 109 90
         C98 111 78 97 64 64"
      stroke-width="4.2"
      filter="url(#rough-ink)"
    />

    <path
      d="M21 42 C31 27 49 42 64 64 C79 86 97 101 108 86"
      stroke-width="1.2"
      opacity="0.42"
      filter="url(#rough-ink)"
    />

    <path
      d="M18 91 C31 110 51 94 64 64 C77 34 98 17 109 39"
